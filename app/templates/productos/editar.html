{% extends "base.html" %}
{% block title %}Editar Producto — Big Royal{% endblock %}

{% block content %}
<div class="page-header">
    <h1>✏️ Editar Producto</h1>
    <a href="{{ url_for('productos.listar') }}" class="btn btn-secondary">← Volver al catálogo</a>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('productos.editar', producto_id=producto.id) }}">
        <div class="form-group">
            <label for="nombre">Nombre del producto <span class="required">*</span></label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                value="{{ producto.nombre }}"
                required
                maxlength="150"
            >
        </div>

        <div class="form-group">
            <label for="precio">Precio de venta (S/)</label>
            <input
                type="number"
                id="precio"
                name="precio"
                value="{{ "%.2f"|format(producto.precio or 0) }}"
                step="0.01"
                min="0"
            >
        </div>

        <div class="form-actions">
            <a href="{{ url_for('productos.listar') }}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>
    </form>
</div>
{% endblock %}
