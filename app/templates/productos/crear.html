{% extends "base.html" %}
{% block title %}Nuevo Producto — Big Royal{% endblock %}

{% block content %}
<div class="page-header">
    <h1>➕ Nuevo Producto</h1>
    <a href="{{ url_for('productos.listar') }}" class="btn btn-secondary">← Volver al catálogo</a>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('productos.crear') }}">
        <div class="form-group">
            <label for="nombre">Nombre del producto <span class="required">*</span></label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ej: Hamburguesa Royal"
                required
                maxlength="150"
            >
        </div>

        <div class="form-group">
            <label for="precio">Precio de venta (S/)</label>
            <input
                type="number"
                id="precio"
                name="precio"
                placeholder="0.00"
                step="0.01"
                min="0"
                value="0"
            >
        </div>

        <p class="subtitulo" style="margin-top: 0;">
            Después de crear el producto podrás agregarle los insumos de su receta.
        </p>

        <div class="form-actions">
            <a href="{{ url_for('productos.listar') }}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-success">Guardar Producto</button>
        </div>
    </form>
</div>
{% endblock %}
