{% extends "base.html" %}
{% block title %}Editar Insumo — Big Royal{% endblock %}

{% block content %}
<div class="page-header">
    <h1>✏️ Editar Insumo</h1>
    <a href="{{ url_for('insumos.listar') }}" class="btn btn-secondary">← Volver al catálogo</a>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('insumos.editar', id=insumo.id) }}" id="insumoForm">
        <div class="form-group">
            <label for="nombre">Nombre del insumo <span class="required">*</span></label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                value="{{ insumo.nombre }}"
                required
                maxlength="150"
            >
        </div>

        <div class="form-group">
            <label for="unidad">Unidad de medida <span class="required">*</span></label>
            <select id="unidad" name="unidad" required>
                {% set unidades = ['kg', 'g', 'L', 'ml', 'unidad', 'docena', 'paquete', 'caja'] %}
                {% for u in unidades %}
                <option value="{{ u }}" {{ 'selected' if insumo.unidad == u else '' }}>{{ u }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="stock_actual">Stock actual</label>
                <input
                    type="number"
                    id="stock_actual"
                    name="stock_actual"
                    value="{{ "%.2f"|format(insumo.stock_actual) }}"
                    step="0.01"
                    min="0"
                >
            </div>

            <div class="form-group">
                <label for="stock_minimo">Stock mínimo</label>
                <input
                    type="number"
                    id="stock_minimo"
                    name="stock_minimo"
                    value="{{ "%.2f"|format(insumo.stock_minimo) }}"
                    step="0.01"
                    min="0"
                >
            </div>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('insumos.listar') }}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>
    </form>
</div>
{% endblock %}
